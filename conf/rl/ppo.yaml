# PPO on per-individual stock, for the individuals of one species.
#
# The two blocks map one-to-one onto TrainerConfig and PPOConfig in
# tensor_beasts/rl/, so anything you can set in code you can set here, and
# train_rl.py flags override whatever is written below.
#
# Size is the setting to be careful with. Below roughly 256 the predator
# population collapses and the three-species dynamic degenerates, so a result
# from a 64x64 world is not a result about this ecology. 256 is for iteration,
# 512 is for anything meant to mean something.

trainer:
  config_path: conf/basic_config.yaml
  size: 256
  entity: Herbivore

  # The reward is each individual's own stock change, eat minus burn minus
  # the reserve lost at death, pooled over a box of this radius around its
  # new cell. 0 is the individual reward. There are no other reward terms.
  reward_radius: 0

  # rule: the rule with free values. linear: a 1x1 convolution.
  # conv, residual, dilated: convolutional trunks. For rule, arch_kwargs may
  # name the critic: {critic: conv, hidden_channels: 64, depth: 3} or
  # {critic: linear}.
  arch: conv
  arch_kwargs: {}
  # Second policy head emitting a continuous metabolic rate, from basal to
  # max_metabolic_rate, still capped by carried biomass. false leaves the rate
  # to the rules and learns movement only.
  metabolic: false
  # Learned memory channels per individual. 0 disables.
  memory_size: 0
  # Offline distillation of the rule-based policy before RL, on the bank's
  # labelled grids, for at most pretrain_epochs, stopping once held-out
  # agreement plateaus. 0 epochs = off. The policy RL starts from is saved as
  # pretrained.pt either way.
  pretrain_epochs: 0
  device: auto
  seed: 0

  total_world_steps: 20000
  segment_steps: 64

  # The start bank: a rule-based run of bank_worlds worlds for bank_steps
  # steps, banked every bank_stride steps after bank_warmup. Every world the
  # run touches (training, extinction resets, evaluation, films) starts from
  # a bank state, in the settled cycles and out of phase with each other.
  bank_worlds: 8
  bank_steps: 3000
  bank_warmup: 1000
  bank_stride: 100
  # Banks are written here under a key made from everything that shapes
  # them and read back by the next process that asks for the same one;
  # null builds the bank every time. About 7.4 GB per bank at 512.
  bank_cache: outputs/bank

  # The metric: mean stock over eval_steps world steps from eval_seeds banked
  # starts, a fixed seeded subset of the bank. T = 4000 is longer than a
  # collapse. Two evaluations per run plus the final at this budget.
  eval_interval: 10000
  eval_steps: 4000
  eval_seeds: 8
  eval_deterministic: false

  checkpoint_interval: 2000
  output_dir: outputs/rl
  log_name: train_log.jsonl

  # On by default: a run that is not in W&B is a run nobody looks at again.
  # --quiet does not turn this off; set wandb: false here, or pass --wandb-host
  # null, if a run should stay local. The JSONL log is written either way.
  wandb: true
  wandb_project: tensor-beasts-rl
  # Defaults to whatever base_url the user's own ~/.config/wandb/settings gives,
  # because that is the host their API key is stored against; this value is the
  # fallback when they have no setting. Null defers to WANDB_BASE_URL, then
  # wandb.ai. See resolve_wandb_host in tensor_beasts/rl/trainer.py.
  wandb_host: http://localhost:8080

ppo:
  learning_rate: 3.0e-4
  clip_range: 0.2
  # Null disables value clipping. Worth trying here because returns drift with
  # the population, which is exactly the case value clipping is meant for.
  value_clip_range: null
  # Zero: thousands of sampled individuals explore already, and entropy rose on
  # its own in every run that collapsed.
  entropy_coef: 0.0
  value_coef: 0.5
  epochs: 4
  minibatch_steps: 16
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  normalize_advantage: true
  # Null disables the early stop. Set to ~0.02 if updates start diverging.
  target_kl: null
  # Pretraining only: soft distillation toward softmax(rule scores /
  # temperature). 0 = hard argmax. Nothing pulls the policy toward the rules
  # once RL starts; planning/HISTORY.md records why. The rule actor's
  # sharpness starts at 1 / temperature.
  imitation_temperature: 0.01
  # Backpropagate memory writes through this many steps of the individual's
  # own trajectory. 0 = off.
  recurrent_window: 0
