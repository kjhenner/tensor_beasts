# DONE. Kept as the record of what ran; the flags --imitation-target and
# --imitation-floor no longer exist, so this config cannot be re-run as is.
#
# What it settled (planning/09): nothing about the throttle. The head started
# with a std of 0.6 on the unit interval and the clamp to [0, 1] rectified
# that noise into a throttle averaging 0.22 against the rule's ~0.08, so
# every trial spent its budget annealing the std, and the anchor at target
# 0.95 (which never released) won because it annealed faster. The sweep that
# replaced it is metabolic.yaml.
#
# Does a learned throttle beat the rule's throttle?
#
#   wandb sweep --project tensor-beasts-rl conf/sweeps/metabolic.yaml
#   wandb agent <sweep-id>          # a second agent in another shell is fine
#
# 16 trials, about three hours with two agents.
#
# There is no control arm here, because the last sweep already is one. All 32
# of its trials ran with the throttle left to the rule-based policy, so every
# cell below has a no-metabolism twin at the same architecture, learning rate,
# reward and anchor target. This runs the metabolism arm of the four best of
# those cells and pairs them:
#
#   reward mode   target   control score (throttle left to the rules)
#   biomass       0.95     12,601
#   biomass-0.5   0.8      12,563
#   biomass       0.8      12,303
#   biomass-0.5   0.95     11,704
#
# Four seeds each, because a single trial's standard error is near 6% and the
# effect looked for here is plausibly that size. Read this as four paired
# differences, each averaged over four seeds, not as a ranking of cells.
#
# WHAT THE THROTTLE IS
#
# Until now the learned predator controlled one lever. The external action
# overrode its direction while the rule set its metabolic rate from a smoothed
# scent gradient, so the policy chose where to go and a hand-written rule chose
# how hard to run, reacting to gradients the policy may have ignored. It could
# not conserve on purpose, sprint at prey it had seen, or trade efficiency for
# speed.
#
# The throttle is now a continuous rate from a Gaussian head over
# [basal_rate, max_metabolic_rate], anchored to the rule's own rate by Gaussian
# log-likelihood on exactly the schedule that anchors movement, under one
# weight for both heads. An earlier draft of this sweep had discrete levels and
# a separate anchor scale, and both were wrong. The rate is a continuous
# quantity, so binning it threw away resolution and made "how many bins" a
# parameter that says nothing about the ecology. Direction and throttle are two
# outputs of one policy imitating one rule, so there is no reason to trust the
# rule's throttle differently from its direction; a separate scale also let the
# throttle's anchor outlive the direction's, which is how the herbivore attempt
# ended up pinned to a rule that rests near basal.
#
# The other half of that failure is fixed. Its reward counted NET biomass
# change, so burning biomass into energy cost reward directly and the only
# rational throttle was off. The biomass reward counts what an individual EATS,
# so burning is neutral to the reward and pays off only through the movement it
# buys, which is the trade the lever exists to make.
#
# WHAT TO LOOK AT
#
# metabolic_unit_mean is the mean throttle in [0, 1], where 0 is basal and 1 is
# the configured maximum. The rule sits near 0.05. A learned throttle that ends
# up there has found nothing; one that ends up high and flat is burning without
# hunting; the interesting outcome is a mean that moves with the hunt, which is
# what metabolic_std and the films can show. metabolic_error is the mean
# absolute distance from the rule's throttle, so it says how far the policy
# travelled from the rule once the anchor released.

program: train_rl.py
method: grid
metric:
  name: eval/score_mean_late
  goal: maximize

parameters:
  # The two axes that pick out the four paired cells. Crossed, these are the
  # four best configurations of the last sweep, listed in the header.
  reward-mode:
    values: [biomass, biomass-0.5]
  imitation-target:
    values: [0.8, 0.95]

  seed:
    values: [0, 1, 2, 3]

  # THE CHANGE. On in every trial; the control is the previous sweep.
  metabolic:
    value: true

  # Committed from the overnight sweep's 32 trials: conv over dilated, 11,108
  # against 10,526, and dilated collapsed entirely at the smaller step; lr 1e-3
  # over 3e-4, 11,306 against 10,130, its largest effect.
  arch:
    value: conv
  lr:
    value: 0.001

  worlds:
    value: 4
  segment-steps:
    value: 32
  minibatch-steps:
    value: 2
  gamma:
    value: 0.997
  imitation-floor:
    value: 0.0
  imitation-coef:
    value: 1.0
  entropy-coef:
    value: 0.002
  target-kl:
    value: 0.02
  epochs:
    value: 2
  pretrain-updates:
    value: 10
  steps:
    value: 5760
  entity:
    value: Predator
  size:
    value: 512
  device:
    value: cuda
  eval-seeds:
    value: 16
  eval-interval:
    value: 1440
  eval-steps:
    value: 400
  checkpoint-interval:
    value: 2880
  film-interval:
    value: 5760

command:
  - ${env}
  - venv/bin/python
  - ${program}
  - ${args}
