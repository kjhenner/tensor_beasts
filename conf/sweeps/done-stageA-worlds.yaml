# Stage A: does training across several worlds actually help?
#
# Two trials, and this is not a hyperparameter search. The batch dimension was
# built on an argument that has never been tested: that a gradient averaged
# over several points of the predator-prey cycle beats one drawn from a single
# point, because otherwise what is learned in a boom is unlearned in the bust.
#
# The answer decides whether `worlds` belongs in every later config or none of
# them, and it also resolves a real tension. The horizon argument in
# planning/06 wants a 96-step segment so credit spans an 81-step predator life.
# Four worlds want the memory. Both do not fit: worlds=4 with segment=96 needs
# 52 GB and is refused. So one of the two arguments has to give, and this stage
# says which.
#
# Both arms run the same number of UPDATES. `--steps` counts segment steps and
# does not scale with `worlds`, so 5760 steps at a 32-step segment is 180
# updates either way. Four worlds simply see four times the data in each of
# those updates, which is the entire point: the comparison is "same number of
# gradient steps, more data behind each one", not "same total data".
#
# It is therefore not a fair wall-clock comparison and is not meant to be. Four
# worlds cost about 2.6x the time per update; whether that buys anything is
# what the KL and the spread will say.
#
# What to read, in order of what it actually proves:
#
#   1. approx_kl and clip_fraction per update. If the gradient is less noisy at
#      four worlds these fall. This is the direct measurement and it does not
#      need the evaluation at all.
#   2. score_spread across evaluation seeds, which is the claim that matters.
#   3. The score itself, which at two trials sits inside the noise.
#
# A null result here is worth having: if the KL is unchanged, each update was
# never gradient-noise-limited, decorrelation buys nothing, and the wall-clock
# is better spent on more updates with the longer segment.
#
#   wandb sweep --project tensor-beasts-rl conf/sweeps/stageA-worlds.yaml
#   wandb agent <sweep-id>

program: train_rl.py
method: grid
metric:
  name: eval/score_mean_late
  goal: maximize

parameters:
  # The axis. 4 is where the card saturates: measured 3.80x simulation
  # throughput at four worlds and 4.26x at eight, so the eighth buys almost
  # nothing. See planning/07-batched-worlds.md.
  worlds:
    values: [1, 4]

  # Segment and memory move with `worlds`, which is why they cannot be columns
  # of their own here. 4 x 32 and 1 x 96 are both about 60 updates over the
  # run and both fit: 8.46 GB and 5.00 GB against the 3090's ~20 GB free.
  # This confounds worlds with segment length, deliberately: the two are not
  # separable at this memory budget, and the pair is what has to be chosen.
  segment-steps:
    value: 32
  minibatch-steps:
    value: 2
  steps:
    value: 5760

  entity:
    value: Predator
  size:
    value: 512
  device:
    value: cuda
  arch:
    value: conv
  gamma:
    value: 0.997
  epochs:
    value: 2
  imitation-coef:
    value: 1.0
  # Committed by stage 0: released, the policy reached 1.116x against 1.064x
  # anchored, so the floor was suppressing the result rather than protecting it.
  imitation-floor:
    value: 0.0
  imitation-target:
    value: 0.95
  foraging-reward:
    value: 0.02
  # Small at four worlds: pretraining materialises its whole segment as one
  # float32 tensor, which the memory estimate does not model because it is
  # transient. See planning/07.
  pretrain-updates:
    value: 10
  target-kl:
    value: 0.02
  entropy-coef:
    value: 0.002
  # Batched evaluation made seeds cheap: 16 seeds is about 71 seconds at 512
  # and 5.6 GB. The spread across them is reported beside the score.
  eval-interval:
    value: 1440
  eval-steps:
    value: 400
  eval-seeds:
    value: 16
  checkpoint-interval:
    value: 2880
  film-interval:
    value: 0
  seed:
    value: 0

command:
  - ${env}
  - venv/bin/python
  - ${program}
  - ${args}
