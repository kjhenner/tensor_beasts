# Does a learned throttle beat the rule's throttle? Paired, this time.
#
#   wandb sweep --project tensor-beasts-rl conf/sweeps/metabolic.yaml
#   wandb agent <sweep-id>          # a second agent in another shell is fine
#
# 8 trials, about 80 minutes with two agents.
#
# One axis, metabolic on or off, at four seeds each. The evaluation worlds
# derive from the training seed, so a trial and its twin at the same seed are
# scored on the same worlds and their difference is the measurement. The
# first attempt paired 16 metabolic trials against the overnight grid, which
# had only seed 0, so three of its four seeds were scored on worlds the
# control never saw. Read this one as four paired differences.
#
# Everything else is a best guess from the two sweeps so far, not a claim:
# conv and lr 1e-3 were the overnight grid's only clear effects, the reward
# modes were inside the noise so biomass stays as the simplest, and the anchor
# is now a fade over the first 20 of 170 updates rather than a controller on
# agreement that never let go. None of these is expected to interact with the
# throttle; if the paired difference is large either way that is the answer,
# and if it is inside the seed spread the lever does not matter at this
# budget and the next question is why, from the diagnostics.
#
# WHAT CHANGED SINCE THE FIRST METABOLIC SWEEP
#
# Three things, all in planning/09. The throttle head's std now starts at
# 0.05 instead of 0.6, so the sampled throttle starts where the rule is
# instead of a quarter hotter. The throttle's anchor judges disagreement at a
# fixed scale of 0.1 instead of the policy's own std, so it cannot strengthen
# itself by shrinking that std. And evaluation scores the throttle at the
# head's mean, because the clamp to [0, 1] turns sampling noise into a bias.
#
# WHAT TO LOOK AT
#
# metabolic_head_mean is the policy's mean throttle in [0, 1], 0 basal and 1
# the configured maximum, and metabolic_rule_mean is the rule's on the same
# cells, so the two are directly comparable. metabolic_head_spread is how much
# the throttle varies across acting individuals: flat means the lever is
# unused, spread means the policy is doing something with it, and
# metabolic_rule_corr says whether that something is what the rule does.
# metabolic_std is the exploration noise, which should stay near 0.05.

program: train_rl.py
method: grid
metric:
  name: eval/score_mean_late
  goal: maximize

parameters:
  # THE QUESTION.
  metabolic:
    values: [true, false]

  seed:
    values: [0, 1, 2, 3]

  # --- best guesses, committed ---
  arch:
    value: conv
  lr:
    value: 0.001
  reward-mode:
    value: biomass
  imitation-coef:
    value: 1.0
  # The anchor fades linearly over this many RL updates and is then gone. 20
  # of 170 is a guard against the first updates wrecking the pretrained
  # policy, not a pull toward the rule.
  imitation-release-updates:
    value: 20

  worlds:
    value: 4
  segment-steps:
    value: 32
  minibatch-steps:
    value: 2
  gamma:
    value: 0.997
  entropy-coef:
    value: 0.002
  target-kl:
    value: 0.02
  epochs:
    value: 2
  pretrain-updates:
    value: 10
  steps:
    value: 5760
  entity:
    value: Predator
  size:
    value: 512
  device:
    value: cuda
  eval-seeds:
    value: 16
  eval-interval:
    value: 1440
  eval-steps:
    value: 400
  checkpoint-interval:
    value: 2880
  film-interval:
    value: 5760

command:
  - ${env}
  - venv/bin/python
  - ${program}
  - ${args}
