# The metabolic lever: can a predator learn when to burn?
#
#   wandb sweep --project tensor-beasts-rl conf/sweeps/metabolic.yaml
#   wandb agent <sweep-id>          # a second agent in another shell is fine
#
# 24 trials, about four hours with two agents.
#
# Until now the learned predator has controlled one lever. The external action
# overrides its direction; the metabolic rate, the move probability and the
# gradient history that sets the rate all still come from the rule-based policy.
# So a learned predator chooses where to go while a hand-written rule decides
# how hard it runs, reacting to gradients the policy may have chosen to ignore.
# It cannot conserve on purpose, sprint at prey it has seen, or trade efficiency
# for speed.
#
# The case is stronger for a predator than it was for the herbivore. A herbivore
# grazes on 78% of steps and its throttle barely matters. A predator eats on
# 2.5% and each meal follows a pursuit: endurance between hunts and speed during
# one are the whole game, and the rule sets both from a smoothed scent gradient
# rather than from anything about the hunt.
#
# The herbivore attempt failed for a reason that is fixed and a reason that is
# not:
#   * Its reward counted NET biomass change, so burning biomass into energy cost
#     reward directly and the throttle collapsed onto its coldest setting. The
#     reward is now biomass EATEN, so burning is neutral to the foraging term
#     and pays off only through the movement it buys. That artefact is gone.
#   * The metabolic anchor taught the rule's own throttle, which rests near
#     basal most of the time, so anchoring to it teaches the learner to run
#     cold. How hard to anchor is therefore part of the axis here rather than a
#     constant: the throttle modes span no anchor, a light one and a full one.

program: train_rl.py
method: grid
metric:
  name: eval/score_mean_late
  goal: maximize

parameters:
  # THE QUESTION, as one axis. Levels and anchor strength are not independent:
  # with no metabolic head the anchor scale is inert, so crossing them as two
  # axes would spend a third of the grid on identical controls.
  #
  #   rules      the throttle stays with the rule-based policy. The control, and
  #              the configuration that scored 12,601 in the last sweep.
  #   free-4     four levels, reward decides the throttle entirely
  #   guided-4   four levels, anchored lightly to the rule's throttle
  #   copied-4   four levels, anchored fully. This is the herbivore's failed
  #              setting, kept as the comparison: the rule rests near basal, so
  #              copying it teaches the learner to run cold.
  #   free-8     eight levels, reward decides. The lever is a continuous
  #   guided-8   quantity and four levels may be too coarse to express
  #              drift, cruise and sprint.
  throttle:
    values: [rules, free-4, guided-4, copied-4, free-8, guided-8]

  # Four training seeds per setting rather than one. The last sweep put a single
  # trial's standard error near 6%, and the effect looked for here is plausibly
  # that size, so seeds are the only lever that resolves it. Read this sweep by
  # throttle-mode mean over four seeds, not by the best cell.
  seed:
    values: [0, 1, 2, 3]

  # --- committed, from the overnight sweep's 32 trials ---
  # conv over dilated, 11,108 against 10,526, and dilated collapsed entirely at
  # the small learning rate. lr 1e-3 over 3e-4, 11,306 against 10,130, the
  # largest effect in that sweep.
  arch:
    value: conv
  lr:
    value: 0.001
  # The four reward modes spanned 6% against standard errors of 450, so the
  # reward's composition is not the binding constraint. biomass wins nominally
  # and needs one hand-chosen constant instead of three. Crucially it is also
  # the reward that makes this experiment interpretable: it counts biomass
  # EATEN, so burning is neutral rather than a direct cost, which is the
  # artefact that neutered the herbivore's metabolic run.
  reward-mode:
    value: biomass
  # 10,984 against 10,844 across 24 runs. A non-effect; fixed at the nominal
  # winner to spend the budget on seeds instead.
  imitation-target:
    value: 0.95

  worlds:
    value: 4
  segment-steps:
    value: 32
  minibatch-steps:
    value: 2
  gamma:
    value: 0.997
  imitation-floor:
    value: 0.0
  imitation-coef:
    value: 1.0
  entropy-coef:
    value: 0.002
  target-kl:
    value: 0.02
  epochs:
    value: 2
  pretrain-updates:
    value: 10
  steps:
    value: 5760
  entity:
    value: Predator
  size:
    value: 512
  device:
    value: cuda
  eval-seeds:
    value: 16
  eval-interval:
    value: 1440
  eval-steps:
    value: 400
  checkpoint-interval:
    value: 2880
  film-interval:
    value: 5760
  # Evaluation only, and left off here. --pin-metabolic-level would hold the
  # throttle fixed to separate its effect from movement's, which is the right
  # follow-up once this sweep says whether the lever helps at all.

command:
  - ${env}
  - venv/bin/python
  - ${program}
  - ${args}
