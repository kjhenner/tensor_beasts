# Stage 1: the screen. Run only after stage 0 says the released policy is viable.
#
# Three axes, 12 trials on a grid. Every other setting is a commitment argued
# in planning/06-predator-sweep.md rather than a value to search.
#
# Read the results knowing the metric's noise floor is 16% across evaluation
# seeds and eight seeds resolves about 11%. A 1.1x trial next to a 1.0x trial
# is the same trial. This screen RANKS; only the five-seed confirmation in
# stage 3 decides.
#
#   wandb sweep --project tensor-beasts-rl conf/sweeps/stage1-screen.yaml
#   wandb agent <sweep-id>

program: train_rl.py
method: grid
metric:
  name: eval/score_mean_late
  goal: maximize

parameters:
  # Axis 1. Every result so far used conv, whose receptive field is 7 cells,
  # on three smooth diffused scent gradients. dilated sees 31 cells for FEWER
  # parameters, 76k against 92k. This is the axis most likely to let the policy
  # find something the 7-cell rules structurally cannot.
  # residual is dropped. It is the largest of the three, 315k parameters
  # against conv's 92k, and at worlds=4 its estimated peak is 23.6 GB against
  # about 20 GB free, so train_rl.py refuses it before it starts. It was also
  # the least motivated value: planning/06 argues dilated is the one to bet on,
  # since it sees 31 cells against conv's 7 for fewer parameters.
  arch:
    values: [conv, dilated]

  # Axis 2. Entropy 0.505 over five actions means the policy commits to one
  # direction about 88% of the time: it is executing, not exploring. For a
  # predator following a scent gradient across many steps, sampling is noise in
  # a pursuit rather than exploration. But removing the anchor removes the only
  # other regulariser, so the right value is not knowable from the anchored
  # runs and must be crossed with the release.
  entropy-coef:
    values: [0.0, 0.002]

  # Axis 3. Median approx_kl was 0.0056 against a target of 0.02, and the KL
  # early stop almost never fired, so there is roughly 3.5x of unused movement
  # budget. target-kl is the safety net if this overshoots.
  lr:
    values: [0.0003, 0.001]

  # Committed. The anchor fades entirely: holding the policy near the rules
  # hides the reward flaw we are trying to find.
  imitation-floor:
    value: 0.0
  imitation-target:
    value: 0.95
  # Set by stage A, which compared worlds 1 and 4 over the same 170 updates.
  # Four worlds cut gradient noise: median approx_kl 0.00483 against 0.00704
  # and clip_fraction 0.066 against 0.090, so each step is genuinely less
  # noisy. The scores tied, 8,849 against 8,676, which is well inside a seed
  # spread of about 3,500, so the KL is the evidence and the scores are not.
  #
  # worlds and segment-steps trade against each other at this memory budget:
  # worlds=4 with segment=96 needs 52 GB and is refused. Stage A resolved that
  # toward worlds, since the shorter segment cost nothing measurable while the
  # decorrelation showed up in the KL. gamma stays 0.997, the soft half of the
  # horizon argument, which does not depend on the segment length.
  worlds:
    value: 4
  segment-steps:
    value: 32
  gamma:
    value: 0.997
  entity:
    value: Predator
  size:
    value: 512
  # A bare "cuda" means the card with the most free memory, not cuda:0:
  # PCI_BUS_ID and FASTEST_FIRST ordering disagree about which card index
  # zero is, so an index is not a stable name. Agents run one trial at a
  # time; a 512 run needs about 6 GB and train_rl.py refuses up front if
  # that will not fit, rather than dying inside pretraining.
  device:
    value: cuda
  steps:
    value: 6000
  epochs:
    value: 2
  minibatch-steps:
    value: 2
  imitation-coef:
    value: 1.0
  foraging-reward:
    value: 0.02
  pretrain-updates:
    value: 30
  target-kl:
    value: 0.02
  eval-interval:
    value: 1500
  eval-steps:
    value: 400
  eval-seeds:
    value: 16
  checkpoint-interval:
    value: 3000
  film-interval:
    value: 0
  seed:
    value: 0

command:
  - ${env}
  - venv/bin/python
  - ${program}
  - ${args}
