# Stage 2: the reward, not a hyperparameter.
#
# This changes the objective rather than tuning it, which is why it is a
# separate stage rather than more columns on the stage 1 grid. Set `arch` and
# `entropy-coef` below to whatever stage 1 chose before running it.
#
# The argument, from planning/06-predator-sweep.md. Measured per agent-step on
# the winning run, survival was 89.6% of the reward and fired on 98.9% of
# steps, so it is very nearly a constant: it contributes almost no gradient,
# only a large mean that the advantage normaliser then removes. Reproduction,
# which is what the evaluation metric actually integrates, was 10.4%. The
# reward spends its signal on the one quantity that barely varies.
#
# Biomass is the simulation's own conserved currency: a predator eats biomass,
# carries it, divides when it crosses a threshold, and hands half to its
# offspring. Survival, reproduction and foraging are three lossy projections of
# it. So survival and reproduction go to zero here and foraging becomes the
# base reward. That is deliberate and total: keeping the old terms in parallel
# would make the comparison unreadable.
#
# The risk this sweep exists to measure: biomass alone is a HOARDING reward,
# because division halves it. offspring-credit turns division into an
# investment by crediting a parent with what it handed on. Zero is the control
# that isolates whether the lineage term does anything at all.
#
#   wandb sweep --project tensor-beasts-rl conf/sweeps/stage2-lineage-reward.yaml

program: train_rl.py
method: grid
metric:
  name: eval/score_mean_late
  goal: maximize

parameters:
  # The axis. First generation only, so the credit stays bounded in a growing
  # population; 1.0 values a unit of offspring biomass exactly as a unit of the
  # individual's own. Measured at 512, going 0 -> 1 raises mean reward per
  # acting individual by 21% and the maximum from 35 to 156, so a division
  # becomes worth more than four kills.
  offspring-credit:
    values: [0.0, 0.5, 1.0]

  # The reward is biomass and nothing else. Watch reproductions per agent-step
  # directly: if it falls below the rules' 0.718 births per step while biomass
  # per individual rises, the hoarding failure has happened and the credit did
  # not fix it.
  survival-reward:
    value: 0.0
  reproduction-reward:
    value: 0.0
  foraging-reward:
    value: 1.0

  # Set these to stage 1's winner before running.
  arch:
    value: conv
  entropy-coef:
    value: 0.002
  lr:
    value: 0.0003

  imitation-floor:
    value: 0.0
  imitation-target:
    value: 0.95
  # Set together with `worlds`, because at this memory budget they trade
  # against each other: worlds=4 with segment=96 needs 52 GB and is refused.
  # Stage A chooses the pair. These are the worlds=1 values; if stage A says
  # four worlds wins, change to worlds 4 / segment 32 / minibatch 2.
  worlds:
    value: 1
  segment-steps:
    value: 96
  gamma:
    value: 0.997
  entity:
    value: Predator
  size:
    value: 512
  # A bare "cuda" means the card with the most free memory, not cuda:0:
  # PCI_BUS_ID and FASTEST_FIRST ordering disagree about which card index
  # zero is, so an index is not a stable name. Agents run one trial at a
  # time; a 512 run needs about 6 GB and train_rl.py refuses up front if
  # that will not fit, rather than dying inside pretraining.
  device:
    value: cuda
  steps:
    value: 6000
  epochs:
    value: 2
  minibatch-steps:
    value: 4
  imitation-coef:
    value: 1.0
  pretrain-updates:
    value: 30
  target-kl:
    value: 0.02
  eval-interval:
    value: 1500
  eval-steps:
    value: 400
  eval-seeds:
    value: 16
  checkpoint-interval:
    value: 3000
  film-interval:
    value: 0
  seed:
    value: 0

command:
  - ${env}
  - venv/bin/python
  - ${program}
  - ${args}
