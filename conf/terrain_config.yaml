display:
  color_displays:
    - title: "cross-section"
      fn_name: "cross_section"
      background_color: [135, 206, 235]
      screen_height: 128
      section_idx: 4
      section_dim: "x"
      levels:
        - key: "${key:terrain,elevation}"
          color: [130, 110, 127]
          scale: 100.0
        - key: "${key:terrain,soil_volume}"
          color: [180, 160, 127]
          color_mod_key: "${key:terrain,soil_water_saturation}"
#          color_mod: [150, 130, 127]
          color_mod: [0, 0, 255]
          scale: 1.0
        - key: "${key:terrain,surface_water_volume}"
          color: [100, 140, 200]
          scale: 1.0
    - title: "layers"
      fn_name: "layered"
      layers:
        - key: "${key:terrain,elevation}"
          threshold: 0
          color_min: [0, 0, 0]
          color_max: [127, 127, 127]
          input_range: [0, 1]
        - key: "${key:terrain,surface_water_volume}"
          threshold: 0.5
          color_min: [0, 0, 128]
          color_max: [0, 0, 255]
          input_range: [0, 20]
        - key: "${key:hydrodynamicplant,energy}"
          threshold: 1
          color_min: [0, 32, 16]
          color_max: [0, 255, 127]
          input_range: [0, 255]
    - title: "soil_sat_coefficient"
      fn_name: "layered"
      layers:
        - key: "${key:hydrodynamicplant,soil_sat_coeff}"
          threshold: -3
          color_min: [255, 0, 0]
          color_max: [0, 255, 0]
          input_range: [-2.5, 2.5]
    - title: "soil_water_saturation"
      fn_name: "layered"
      layers:
        - key: "${key:terrain,soil_water_saturation}"
          threshold: 0
          color_min: [0, 0, 0]
          color_max: [255, 255, 255]
          input_range: [0, 1]
    - title: "available_sat"
      fn_name: "layered"
      layers:
        - key: "${key:terrain,surface_water_volume}"
          threshold: 0.0
          color_min: [0, 0, 0]
          color_max: [255, 255, 255]
          input_range: [0, 0.5]

world:
  device: auto
  running: True
  max_ups: 0
  size: [256, 256]  # [Height, Width]

  entities:
    Terrain:
      elevation:
        ramp:
      surface_water_volume:
        # Rain is delivered on every cell for the first half of each 1000-step
        # cycle (the season is hard-coded in SurfaceWaterVolume.update).
        # It must exceed infiltration_rate or there is never any runoff, and it
        # must be within an order of magnitude of soil evaporation or the soil
        # can never wet up. At 1.5e-3 roughly a third of the rain runs off.
        rainfall_rate: 1.5e-3
        # NOTE: on a `ramp` with elevation_scale 100 the head difference between
        # adjacent cells (~0.8) dwarfs the water depth, so `flow` always takes
        # its "outflow exceeds available water" branch and empties each cell
        # completely every step. flow_rate and relaxation_factor therefore have
        # no effect on surface water here.
        flow_rate: 0.15
        relaxation_factor: 1.0
        steps: 1
      soil_water_volume:
        field_capacity: 0.55
        # Was 2e-7: five thousand times below this feature's own default and
        # forty times below evaporation, so the soil could only ever dry out and
        # plant growth (ideal saturation 0.65 +/- 0.2) never once fired.
        infiltration_rate: 1e-3
        evaporation_rate: 2e-4
        flow_rate: 0.1
        saturation_gradient_coeff: 0.3
      soil_volume:
        erosion_rate: 0.05
        init_scale: 10.0

    HydrodynamicPlant:
      initial_energy: 32
      init_prob: 0.02
      scent:
        energy_key: "${key:hydrodynamicplant,energy}"
        emission_rate: 1.0
      seed:
        energy_key: "${key:hydrodynamicplant,energy}"
        crowding_key: "${key:hydrodynamicplant,crowding}"
        germination_prob: 0.005
        seed_prob: 0.05
      crowding:
        energy_key: "${key:hydrodynamicplant,energy}"
