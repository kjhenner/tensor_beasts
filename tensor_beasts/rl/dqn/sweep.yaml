program: tensor_beasts.rl.dqn.dqn_script
method: random
metric:
  name: eval/mean_reward
  goal: maximize
parameters:
  collector.init_random_frames:
    values: [1_000, 4_000, 7_000, 10_000, 13_000, 16_000, 19_000, 22_000, 25_000, 28_000]
command:
  - poetry
  - run
  - python
  - -m
  - ${program}
  - ${args_no_hyphens}